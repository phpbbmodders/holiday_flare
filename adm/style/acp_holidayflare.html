<!-- INCLUDE overall_header.html -->
<!-- INCLUDEJS @phpbbmodders_holidayflare/acp.js -->
<!-- INCLUDECSS @phpbbmodders_holidayflare/acp.css -->

<h1>{L_ACP_HOLIDAYFLARE}</h1>

<p id="holidayflare-explain">{L_ACP_HOLIDAYFLARE_EXPLAIN}</p>
<p id="holidayflare-status" role="status" aria-atomic="true" data-cleared-message="{{ lang('HOLIDAY_SELECTION_CLEARED')|e('html_attr') }}"></p>

<form id="select_victim" method="post" action="{U_ACTION}">

	<!-- BEGIN holidays -->
	<fieldset class="holiday-group">
		<legend>{holidays.LABEL}</legend>
		<!-- BEGIN placements -->
		<dl>
			<dt><label for="holidayflare_{holidays.ID}_{holidays.placements.ID}">{holidays.placements.LABEL}{L_COLON}</label></dt>
			<dd>
				<select aria-describedby="holidayflare-explain" class="holiday-select" data-placement="{holidays.placements.ID}" name="holidayflare_{holidays.ID}_{holidays.placements.ID}" id="holidayflare_{holidays.ID}_{holidays.placements.ID}">
					<option value="">{L_HOLIDAY_NONE}</option>
					<!-- BEGIN options -->
					<option value="{holidays.placements.options.ID}"<!-- IF holidays.placements.options.S_SELECTED --> selected="selected"<!-- ENDIF -->>{holidays.placements.options.LABEL}</option>
					<!-- END options -->
				</select>
			</dd>
		</dl>
		<!-- END placements -->
	</fieldset>
	<!-- END holidays -->

	<fieldset>
		<legend>{L_ACP_SUBMIT_CHANGES}</legend>
		<p class="submit-buttons">
			<input class="button1" type="submit" id="submit" name="submit" value="{L_SUBMIT}" />&nbsp;
			<input class="button2" type="reset" id="reset" name="reset" value="{L_RESET}" />
		</p>
		{S_FORM_TOKEN}
	</fieldset>

</form>

<!-- INCLUDE overall_footer.html -->
